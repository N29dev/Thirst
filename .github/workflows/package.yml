name: Thirst unsigned test bundles
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package.yml'
      - 'scripts/prepare_macos_bundle.sh'
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'vite.config.ts'
      - 'svelte.config.js'
      - 'tsconfig.json'

permissions:
  contents: read

jobs:
  macos-arm64:
    name: macOS ARM64 app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Install frontend
        run: npm install --no-audit --no-fund
      - name: Build macOS app including native Roblox login
        run: npm run bundle:mac
      - name: Verify macOS bundle and nested helper signatures
        run: |
          APP="src-tauri/target/release/bundle/macos/Thirst.app"
          HELPER="$APP/Contents/Resources/resources/ThirstLogin"
          test -x "$HELPER"
          file "$APP/Contents/MacOS/thirst" "$HELPER"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --verify --strict --verbose=2 "$HELPER"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E "Signature=adhoc|Authority=|Identifier="
          echo "Ad-hoc signatures are valid; Apple notarization is not included."
      - name: Archive ad-hoc signed macOS test app
        run: |
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent Thirst.app "$GITHUB_WORKSPACE/Thirst-macOS-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Thirst-macOS-arm64-ad-hoc
          path: Thirst-macOS-arm64.zip
          if-no-files-found: error

  windows:
    name: Windows NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend
        run: npm install --no-audit --no-fund
      - name: Build Windows unsigned installer
        shell: pwsh
        run: |
          # NSIS helper downloads occasionally return HTTP 504 from GitHub.
          # Reuse the compiled Rust release on retry; don't force another clean build.
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm run bundle:windows
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) {
              Write-Warning "Packaging attempt $attempt failed; retrying after 15 seconds."
              Start-Sleep -Seconds 15
            }
          }
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: Thirst-Windows-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
